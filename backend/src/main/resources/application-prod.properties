# Ative com SPRING_PROFILES_ACTIVE=prod. Segredos sem valor padrão para impedir deploy com credenciais locais.
api.security.token.secret=${JWT_SECRET}
trails.auth.empresas.secret=${EMPRESAS_JWT_SECRET}
trails.auth.capacita.secret=${CAPACITA_JWT_SECRET}
spring.datasource.url=${OPORTUNIDADES_DB_URL:${DATABASE_URL}}
spring.datasource.username=${OPORTUNIDADES_DB_USERNAME:${DATABASE_USERNAME}}
spring.datasource.password=${OPORTUNIDADES_DB_PASSWORD:${DATABASE_PASSWORD}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
trampolim.datasource.empresas.enabled=${EMPRESAS_DB_ENABLED:true}
trampolim.datasource.empresas.url=${EMPRESAS_DB_URL}
trampolim.datasource.empresas.username=${EMPRESAS_DB_USERNAME}
trampolim.datasource.empresas.password=${EMPRESAS_DB_PASSWORD}
trampolim.datasource.capacita.enabled=${CAPACITA_DB_ENABLED:true}
trampolim.datasource.capacita.url=${CAPACITA_DB_URL}
trampolim.datasource.capacita.username=${CAPACITA_DB_USERNAME}
trampolim.datasource.capacita.password=${CAPACITA_DB_PASSWORD}
server.error.include-message=never
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
app.mail.enabled=${MAIL_ENABLED:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
