spring.application.name=backend
capacita.admin-emails=${CAPACITA_ADMIN_EMAILS:}
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${OPORTUNIDADES_DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/trampolim_db}}
spring.datasource.username=${OPORTUNIDADES_DB_USERNAME:${DATABASE_USERNAME:root}}
spring.datasource.password=${OPORTUNIDADES_DB_PASSWORD:${DATABASE_PASSWORD:root}}
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
trampolim.datasource.empresas.enabled=${EMPRESAS_DB_ENABLED:true}
trampolim.datasource.empresas.url=${EMPRESAS_DB_URL:jdbc:postgresql://localhost:5433/trampolim_empresas_db}
trampolim.datasource.empresas.username=${EMPRESAS_DB_USERNAME:trampolim_empresas}
trampolim.datasource.empresas.password=${EMPRESAS_DB_PASSWORD:dev_empresas_only}
trampolim.datasource.capacita.enabled=${CAPACITA_DB_ENABLED:true}
trampolim.datasource.capacita.url=${CAPACITA_DB_URL:jdbc:postgresql://localhost:5434/trampolim_capacita_db}
trampolim.datasource.capacita.username=${CAPACITA_DB_USERNAME:trampolim_capacita}
trampolim.datasource.capacita.password=${CAPACITA_DB_PASSWORD:dev_capacita_only}
api.security.token.secret=${JWT_SECRET:TRAMPOLIM_LOCAL_DEV_SECRET_CHANGE_ME_2026}
trails.auth.empresas.secret=${EMPRESAS_JWT_SECRET:TRAMPOLIM_EMPRESAS_LOCAL_SECRET_CHANGE_ME_2026}
trails.auth.capacita.secret=${CAPACITA_JWT_SECRET:TRAMPOLIM_CAPACITA_LOCAL_SECRET_CHANGE_ME_2026}
trails.auth.legacy-company.enabled=${LEGACY_COMPANY_AUTH_ENABLED:false}
trails.auth.legacy-organizations.enabled=${LEGACY_ORGANIZATIONS_ENABLED:false}
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=130MB
capacita.media.root=${CAPACITA_MEDIA_ROOT:storage/capacita/videos}
capacita.media.ffprobe=${CAPACITA_FFPROBE:ffprobe}
capacita.media.ffmpeg=${CAPACITA_FFMPEG:ffmpeg}
capacita.questions.media-max-bytes=${CAPACITA_QUESTION_MEDIA_MAX_BYTES:26214400}
capacita.questions.audio-max-seconds=${CAPACITA_QUESTION_AUDIO_MAX_SECONDS:120}
capacita.questions.video-max-seconds=${CAPACITA_QUESTION_VIDEO_MAX_SECONDS:120}
capacita.questions.media-quota-bytes=${CAPACITA_QUESTION_MEDIA_QUOTA_BYTES:268435456}
capacita.questions.media-uploads-hour=${CAPACITA_QUESTION_UPLOADS_HOUR:12}
capacita.questions.closed-retention-days=${CAPACITA_QUESTION_CLOSED_RETENTION_DAYS:0}
capacita.library.max-bytes=${CAPACITA_LIBRARY_MAX_BYTES:20971520}
capacita.library.max-pages=${CAPACITA_LIBRARY_MAX_PAGES:300}
capacita.library.quota-bytes=${CAPACITA_LIBRARY_QUOTA_BYTES:536870912}
capacita.library.processing-seconds=${CAPACITA_LIBRARY_PROCESSING_SECONDS:45}
capacita.library.deleted-retention-days=${CAPACITA_LIBRARY_DELETED_RETENTION_DAYS:30}
capacita.inclusion.closed-retention-days=${CAPACITA_SUPPORT_CLOSED_RETENTION_DAYS:90}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
app.admin.emails=${ADMIN_EMAILS:}
app.mail.enabled=${MAIL_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5-mini}
payments.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
payments.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
trails.auth.legacy-token.enabled=${LEGACY_OPORTUNIDADES_TOKENS_ENABLED:false}

# Explicit bounded pools per instance. Budget: replicas * sum(maximum-pool-size).
spring.datasource.hikari.pool-name=oportunidades
spring.datasource.hikari.maximum-pool-size=${OPORTUNIDADES_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${OPORTUNIDADES_DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=2000
trampolim.datasource.empresas.hikari.pool-name=empresas
trampolim.datasource.empresas.hikari.maximum-pool-size=${EMPRESAS_DB_POOL_MAX:10}
trampolim.datasource.empresas.hikari.minimum-idle=${EMPRESAS_DB_POOL_MIN:1}
trampolim.datasource.empresas.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
trampolim.datasource.empresas.hikari.validation-timeout=2000
trampolim.datasource.capacita.hikari.pool-name=capacita
trampolim.datasource.capacita.hikari.maximum-pool-size=${CAPACITA_DB_POOL_MAX:10}
trampolim.datasource.capacita.hikari.minimum-idle=${CAPACITA_DB_POOL_MIN:1}
trampolim.datasource.capacita.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
trampolim.datasource.capacita.hikari.validation-timeout=2000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.threads.max=${HTTP_THREADS_MAX:200}
server.tomcat.accept-count=${HTTP_ACCEPT_COUNT:100}
server.tomcat.max-connections=${HTTP_MAX_CONNECTIONS:8192}
server.tomcat.connection-timeout=10s
server.forward-headers-strategy=none
spring.task.scheduling.pool.size=4
server.error.include-message=never
server.error.include-stacktrace=never

# Management is private by default; never route this port through the public proxy.
management.server.port=${MANAGEMENT_PORT:9001}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=trampolim
operations.monitoring-key=${MONITORING_KEY:}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p logger=%logger{50} request_id=%X{requestId} event=%m%n
operations.catalog-jobs-enabled=${CATALOG_JOBS_ENABLED:true}

radar.internal-api-url=${RADAR_INTERNAL_API_URL:http://127.0.0.1:8080/api}
radar.bridge-secret=${RADAR_BRIDGE_SECRET:}

# Future talent: bounded durable work, notifications inside Oportunidades only.
future.poll-enabled=${FUTURE_TALENT_POLL_ENABLED:${CATALOG_JOBS_ENABLED:true}}
future.poll-delay-ms=${FUTURE_TALENT_POLL_DELAY_MS:60000}

# Institutional logo storage; no files are stored in PostgreSQL.
hub.logo-directory=${HUB_LOGO_DIRECTORY:storage/hub-logos}

# Adaptive learning and durable passport/Radar invalidation
passport.delivery-enabled=${PASSPORT_DELIVERY_ENABLED:${CATALOG_JOBS_ENABLED:true}}
passport.delivery-delay-ms=${PASSPORT_DELIVERY_DELAY_MS:30000}

# Priority 5: external AI requires explicit enablement and per-request consent.
mentor.ai-enabled=${MENTOR_AI_ENABLED:false}
mentor.base-url=${MENTOR_BASE_URL:https://api.openai.com}
mentor.user-daily-calls=${MENTOR_USER_DAILY_CALLS:20}
mentor.global-daily-calls=${MENTOR_GLOBAL_DAILY_CALLS:1000}
mentor.user-daily-tokens=${MENTOR_USER_DAILY_TOKENS:40000}
mentor.global-daily-tokens=${MENTOR_GLOBAL_DAILY_TOKENS:1000000}
mentor.max-output-tokens=${MENTOR_MAX_OUTPUT_TOKENS:600}
mentor.input-usd-per-million=${MENTOR_INPUT_USD_PER_MILLION:}
mentor.output-usd-per-million=${MENTOR_OUTPUT_USD_PER_MILLION:}
career.delivery-enabled=${CAREER_DELIVERY_ENABLED:${CATALOG_JOBS_ENABLED:true}}
career.delivery-delay-ms=${CAREER_DELIVERY_DELAY_MS:30000}
career.observatory-capture-enabled=${OBSERVATORY_CAPTURE_ENABLED:${CATALOG_JOBS_ENABLED:true}}
career.observatory-capture-delay-ms=${OBSERVATORY_CAPTURE_DELAY_MS:3600000}
