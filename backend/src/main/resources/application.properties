spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${OPORTUNIDADES_DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/trampolim_db}}
spring.datasource.username=${OPORTUNIDADES_DB_USERNAME:${DATABASE_USERNAME:root}}
spring.datasource.password=${OPORTUNIDADES_DB_PASSWORD:${DATABASE_PASSWORD:root}}
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
trampolim.datasource.empresas.enabled=${EMPRESAS_DB_ENABLED:true}
trampolim.datasource.empresas.url=${EMPRESAS_DB_URL:jdbc:postgresql://localhost:5433/trampolim_empresas_db}
trampolim.datasource.empresas.username=${EMPRESAS_DB_USERNAME:trampolim_empresas}
trampolim.datasource.empresas.password=${EMPRESAS_DB_PASSWORD:dev_empresas_only}
trampolim.datasource.capacita.enabled=${CAPACITA_DB_ENABLED:true}
trampolim.datasource.capacita.url=${CAPACITA_DB_URL:jdbc:postgresql://localhost:5434/trampolim_capacita_db}
trampolim.datasource.capacita.username=${CAPACITA_DB_USERNAME:trampolim_capacita}
trampolim.datasource.capacita.password=${CAPACITA_DB_PASSWORD:dev_capacita_only}
api.security.token.secret=${JWT_SECRET:TRAMPOLIM_LOCAL_DEV_SECRET_CHANGE_ME_2026}
trails.auth.empresas.secret=${EMPRESAS_JWT_SECRET:TRAMPOLIM_EMPRESAS_LOCAL_SECRET_CHANGE_ME_2026}
trails.auth.capacita.secret=${CAPACITA_JWT_SECRET:TRAMPOLIM_CAPACITA_LOCAL_SECRET_CHANGE_ME_2026}
trails.auth.legacy-company.enabled=${LEGACY_COMPANY_AUTH_ENABLED:false}
trails.auth.legacy-organizations.enabled=${LEGACY_ORGANIZATIONS_ENABLED:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
app.admin.emails=${ADMIN_EMAILS:}
app.mail.enabled=${MAIL_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5-mini}
payments.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
payments.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
trails.auth.legacy-token.enabled=${LEGACY_OPORTUNIDADES_TOKENS_ENABLED:false}
