groups:
  - name: trampolim
    rules:
      - alert: TrampolimHighServerErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.01
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "API server error rate above 1%"}
      - alert: TrampolimHighP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "API p95 above 500ms; inspect endpoints and media separately"}
      - alert: TrampolimSseNearCapacity
        expr: capacita_sse_connections / capacita_sse_capacity > 0.8
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "SSE instance above 80% of configured capacity"}
