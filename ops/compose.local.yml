x-api: &api
  build: ../backend
  init: true
  env_file: .env.local
  networks: [app, data]
  environment: &api-environment
    SERVER_PORT: 8080
    MANAGEMENT_PORT: 9001
    MANAGEMENT_ADDRESS: 0.0.0.0
    HTTP_THREADS_MAX: 100
    HTTP_ACCEPT_COUNT: 100
    CAPACITA_MEDIA_ROOT: /app/storage/capacita/videos
  volumes: ["private_media:/app/storage"]
  expose: ["8080", "9001"]
  stop_grace_period: 40s
  mem_limit: 2g
  cpus: 1.5
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  api1:
    <<: *api
    environment:
      <<: *api-environment
      CATALOG_JOBS_ENABLED: "true"
  api2:
    <<: *api
    environment:
      <<: *api-environment
      CATALOG_JOBS_ENABLED: "false"
  frontend:
    networks: [app]
    build: ../frontend
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      api1: {condition: service_healthy}
      api2: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  private_media:

networks:
  app:
  data:
    external: true
    name: ${DATABASE_NETWORK:-backend_default}
