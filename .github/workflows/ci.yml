name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/.playwright-browsers
      - run: npm run test:e2e
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trampolim_db
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d trampolim_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-empresas:
        image: postgres:16
        env:
          POSTGRES_DB: trampolim_empresas_db
          POSTGRES_USER: trampolim_empresas
          POSTGRES_PASSWORD: dev_empresas_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trampolim_empresas -d trampolim_empresas_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-capacita:
        image: postgres:16
        env:
          POSTGRES_DB: trampolim_capacita_db
          POSTGRES_USER: trampolim_capacita
          POSTGRES_PASSWORD: dev_capacita_only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U trampolim_capacita -d trampolim_capacita_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/trampolim_db
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn --batch-mode -Dspring.jpa.hibernate.ddl-auto=validate test
        working-directory: backend
