<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo escuro (Ink) com bordas arredondadas -->
  <rect width="100" height="100" rx="22" fill="#182642" />
  
  <!-- Base estrutural (A ponte/pilar) - Azul -->
  <rect x="42" y="50" width="16" height="30" rx="8" fill="#2E5C8A" />
  
  <!-- Lona do trampolim tencionada para o salto - Amarelo -->
  <path d="M 20 45 Q 50 65 80 45" fill="none" stroke="#F2B705" stroke-width="12" stroke-linecap="round" />
  
  <!-- O jovem impulsionado (referência ao 'i' vermelho da logo) - Vermelho -->
  <circle cx="50" cy="22" r="10" fill="#C2333B" />
</svg>
