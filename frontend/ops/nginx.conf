worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 8192; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/javascript text/css image/svg+xml;
  log_format safe '$time_iso8601 method=$request_method status=$status bytes=$body_bytes_sent elapsed=$request_time upstream_elapsed=$upstream_response_time request_id=$upstream_http_x_request_id';
  access_log /var/log/nginx/access.log safe;
  error_log /var/log/nginx/error.log crit;
  upstream api_read { least_conn; server api1:8080 max_fails=2 fail_timeout=10s; server api2:8080 max_fails=2 fail_timeout=10s; keepalive 32; }
  # Writes/auth/uploads remain on one node until all local limiters/leases are distributed.
  upstream api_write { server api1:8080; keepalive 16; }
  map $request_method $api_pool { default api_write; GET api_read; HEAD api_read; }
  limit_req_zone $binary_remote_addr zone=auth:10m rate=12r/m;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 130m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /actuator { return 404; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ ^/api/(auth|empresas/auth|capacita/auth)/ {
      limit_req zone=auth burst=12 nodelay;
      limit_req_status 429;
      proxy_pass http://api_write;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_next_upstream off;
    }
    location = /api/capacita/learning/notifications/stream {
      limit_conn connections 20;
      limit_conn_status 429;
      proxy_pass http://api_read;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 150s;
      add_header Cache-Control "no-store";
      add_header X-Accel-Buffering "no";
    }
    location /api/ {
      proxy_pass http://$api_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_connect_timeout 3s;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_send_timeout 90s;
      proxy_read_timeout 90s;
      # Never retry a mutation; a network failure may occur after commit.
      proxy_next_upstream off;
      add_header Cache-Control "no-store";
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
